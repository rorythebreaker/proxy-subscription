name: Refresh Proxy Subscription
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'tests/**'
      - sources.json
      - requirements.txt
      - .github/workflows/refresh.yml
permissions:
  contents: write
concurrency:
  group: refresh-proxies
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      XRAY_VERSION: '26.10.31'
      MAX_PROTOCOL_CHECKS: '600'
      PROTOCOL_WORKERS: '24'
      STALE_TTL_SECONDS: '600'
      MAX_LATENCY_MS: '6000'
      MIN_SPEED_MBPS: '10'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pinned Xray
        uses: actions/cache@v4
        with:
          path: .tools/xray
          key: xray-${{ runner.os }}-${{ runner.arch }}-${{ env.XRAY_VERSION }}
      - name: Install pinned Xray
        run: |
          set -euo pipefail
          mkdir -p .tools
          if [ ! -x .tools/xray ]; then
            curl --fail --silent --show-error --location --max-time 45 \
              "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip" \
              --output "${RUNNER_TEMP}/xray.zip"
            echo "e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214  ${RUNNER_TEMP}/xray.zip" | sha256sum --check
            unzip -p "${RUNNER_TEMP}/xray.zip" xray > .tools/xray
            chmod +x .tools/xray
          fi
          echo "${GITHUB_WORKSPACE}/.tools" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - name: Test parser, profiles, publication and real Xray roundtrip
        run: python -m unittest discover -s tests -v
      - name: Refresh and assemble subscriptions
        run: python refresh.py
      - name: Report publication freshness and filtering
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          combined = json.loads(Path('public/combined_status.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Subscription refresh\n\n')
              summary.write(f"Published at: {combined['published_at']}\n\n")
              summary.write(f"Protocol counts: {combined['counts']}\n\n")
              for name in ('status.json', 'combined_status.json'):
                  summary.write(f'### {name}\n\n```json\n{Path("public", name).read_text()}\n```\n\n')
          PY
      - name: Validate exported profiles and measurements
        run: python validate_publication.py
      - name: Commit consistent subscription
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if git diff --cached --quiet; then
            exit 0
          fi
          calculated_from="$(git rev-parse HEAD)"
          git commit -m "Refresh proxy subscription"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git diff --quiet "$calculated_from" origin/main -- \
              '*.py' tests/ sources.json requirements.txt .github/workflows/refresh.yml; then
              echo "Collector code changed during refresh; refusing stale results. New code triggers its own run."
              exit 1
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Published files changed concurrently; refusing to overwrite them"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Fail visibly when checking infrastructure failed
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          status = json.loads(Path('public/status.json').read_text())
          combined = json.loads(Path('public/combined_status.json').read_text())
          if status.get('error'):
              raise SystemExit(status['error'])
          if combined['socks_exit_code'] != 0:
              raise SystemExit(f"SOCKS5 collector exited with {combined['socks_exit_code']}")
          PYCODE
