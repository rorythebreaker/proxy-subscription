name: Refresh Proxy Subscription
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-proxies
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python update.py
      - name: Install sing-box
        run: |
          curl -fsSL https://sing-box.app/install.sh | sudo sh
          sing-box version
      - run: python update_protocols.py
      - name: Commit subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh proxy subscription"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Rebase conflict: refusing to overwrite remote changes"
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push race on attempt $attempt; retrying"
              sleep 3
            done
            echo "Unable to push after five attempts"
            exit 1
          fi
